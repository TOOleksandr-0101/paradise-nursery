<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting - Paradise Nursery</title>
    <script>
      // Single Page App redirect for GitHub Pages with HashRouter
      const repoBase = '/paradise-nursery/';
      const pathname = window.location.pathname;
      let route = pathname.startsWith(repoBase)
        ? pathname.slice(repoBase.length)
        : pathname.replace(/^\//, '');

      route = route.replace(/\/$/, '');

      window.location.replace(
        repoBase + (route ? '#/' + route : '') + window.location.search + window.location.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Paradise Nursery...</p>
  </body>
</html>
